<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>SSE案例01</h1>
    <button id="btn">发请求给后端制造邮件</button>




    <script>
        // 1. 发普通请求给后端制造邮件--->后端写接口,制造邮件的接口,处理普通请求,启用后台任务(制造邮件的函数);
        const btn = document.getElementById("btn");
        btn.onclick = async function () {
            const res = await fetch('http://localhost:8000/sse01?session_id=123') // 可以写路径参数也可以写查询参数
            const data = await res.json()
            console.log(data) // 打印制造邮件的开始
            // 2. 订阅SSE,建立SSE请求,订阅流式响应推送的数据
            // 订阅SSE请求建立长连接 ---> 后端写接口,接收处理SSE请求,返回流式响应;
            es = new EventSource("http://localhost:8000/handlesse01?session_id=123")
            // 前端要接收流式响应推送的数据,那么就得做事件监听,
            // onmessage事件就是用来接收流式响应推送的数据的,一旦有消息来,就会触发,然后进行后面的处理
            es.onmessage = function (e) {
                console.log(e.data)
                // const divObj = document.getElementById("content")
                // divObj.innerHTML += e.data + "<br/>" //innerHTML读写一体化

                if(e.data !== "None") {
                    const divObj = document.getElementById("content")
                    divObj.innerHTML += e.data + "<br/>" //innerHTML读写一体化
                }else {
                    es.close() // 关闭SSE连接
                }
            }
        }

    </script>


</body>
</html>
